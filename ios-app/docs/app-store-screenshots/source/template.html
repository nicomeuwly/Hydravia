<!doctype html>
<!--
  App Store marketing screenshot, 1320 × 2868 (iPhone 6.9").
  Open as template.html?lang=fr&n=1 (n = 1…5). Rendered by render.sh.
  Captures come from ../iphone-6.9/<lang>/; fonts from the landing page.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Space Grotesk';
    font-weight: 400 700;
    src: url('../../../../landing-page/public/fonts/space-grotesk-latin.woff2') format('woff2');
  }
  :root {
    --primary-dark: #0b3d5c;
    --water-deep: #07314a;
    --abyss: #062940;
    --accent-cyan: #3e9bc7;
    --foam: #8fd6f2;
    --accent: #de9a2f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1320px; height: 2868px; overflow: hidden; }
  body {
    position: relative;
    font-family: 'Space Grotesk', sans-serif;
    color: #fff;
    background:
      radial-gradient(110% 60% at var(--glow-x, 80%) 4%, rgba(62, 155, 199, 0.42), transparent 62%),
      radial-gradient(90% 50% at 10% 100%, rgba(31, 110, 140, 0.55), transparent 70%),
      linear-gradient(168deg, #0b3d5c 0%, #07314a 58%, #062940 100%);
  }
  .waves { position: absolute; left: 0; right: 0; bottom: 0; height: 1100px; }
  .copy {
    position: absolute; top: 150px; left: 80px; right: 80px;
    text-align: center;
  }
  h1 {
    font-weight: 700; font-size: 124px; line-height: 1.02;
    letter-spacing: -0.035em;
    text-wrap: balance;
  }
  h1 em { font-style: normal; color: var(--foam); }
  p {
    margin-top: 40px;
    font-weight: 500; font-size: 48px; line-height: 1.25;
    color: rgba(230, 245, 252, 0.88);
    text-wrap: balance;
  }
  /* Device: 1320 × 2868 screen scaled to 960 wide, titanium rim. */
  .phone {
    position: absolute; left: 50%; top: 650px;
    width: 1004px; height: 2130px; transform: translateX(-50%);
    border-radius: 158px;
    padding: 22px;
    background: linear-gradient(145deg, #3a4b57 0%, #121d25 40%, #0b141a 60%, #33444f 100%);
    box-shadow:
      0 0 0 3px rgba(255, 255, 255, 0.14),
      0 60px 120px rgba(2, 18, 30, 0.6),
      0 20px 40px rgba(2, 18, 30, 0.35);
  }
  .phone::before { /* inner black bezel */
    content: ''; position: absolute; inset: 10px; border-radius: 148px; background: #05090c;
  }
  .screen {
    position: relative; width: 960px; height: 2086px;
    border-radius: 136px; overflow: hidden; background: #000;
  }
  .screen img { display: block; width: 100%; height: 100%; }
  .island {
    position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
    width: 274px; height: 80px; border-radius: 40px; background: #000;
  }
  .btn { position: absolute; width: 8px; border-radius: 4px; background: #26343e; }
</style>
</head>
<body>
<svg class="waves" viewBox="0 0 1320 1100" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0 420 C 220 360, 420 470, 660 420 S 1100 360, 1320 410 L1320 1100 L0 1100 Z" fill="rgba(62,155,199,0.10)"/>
  <path d="M0 560 C 260 500, 480 610, 720 560 S 1120 500, 1320 560 L1320 1100 L0 1100 Z" fill="rgba(62,155,199,0.10)"/>
  <path d="M0 720 C 240 670, 520 770, 760 720 S 1140 670, 1320 715 L1320 1100 L0 1100 Z" fill="rgba(4,30,46,0.45)"/>
</svg>

<div class="copy">
  <h1 id="title"></h1>
  <p id="sub"></p>
</div>

<div class="phone">
  <div class="btn" style="left:-6px; top:430px; height:110px"></div>
  <div class="btn" style="left:-6px; top:580px; height:190px"></div>
  <div class="btn" style="left:-6px; top:800px; height:190px"></div>
  <div class="btn" style="right:-6px; top:640px; height:300px"></div>
  <div class="screen">
    <img id="shot" alt="">
    <div class="island"></div>
  </div>
</div>

<script>
  const COPY = {
    fr: [
      ['home',    'Bois. <em>Débloque.</em><br>Avance.', 'Les apps de ton choix se verrouillent jusqu’à ton verre.'],
      ['thirst',  'Une question,<br><em>la bonne dose</em>', 'Dis comment tu te sens, Hydravia calcule ton verre.'],
      ['dose',    'Tu bois,<br><em>tout se débloque</em>', 'Un verre à ta mesure, et tes apps reviennent.'],
      ['history', 'Ta régularité,<br><em>sans culpabilité</em>', 'Des séries qui motivent, jamais de reproches.'],
      ['widgets', 'Ton eau<br><em>d’un coup d’œil</em>', 'Widgets sur l’écran d’accueil et app Apple Watch.'],
    ],
    en: [
      ['home',    'Drink. <em>Unlock.</em><br>Move on.', 'The apps you pick lock until you drink.'],
      ['thirst',  'One question,<br><em>the right amount</em>', 'Say how you feel, Hydravia sizes your glass.'],
      ['dose',    'Drink, and<br><em>everything unlocks</em>', 'A glass sized to your day, then your apps are back.'],
      ['history', 'Your streak,<br><em>without the guilt</em>', 'Streaks that motivate, never a lecture.'],
      ['widgets', 'Your water<br><em>at a glance</em>', 'Home Screen widgets and an Apple Watch app.'],
    ],
  };
  const q = new URLSearchParams(location.search);
  const lang = q.get('lang') === 'en' ? 'en' : 'fr';
  const n = Math.min(5, Math.max(1, Number(q.get('n')) || 1));
  const [scene, title, sub] = COPY[lang][n - 1];
  document.documentElement.lang = lang;
  document.getElementById('title').innerHTML = title;
  document.getElementById('sub').textContent = sub;
  document.getElementById('shot').src = `../iphone-6.9/${lang}/0${n}-${scene}.png`;
  // The glow drifts across the set so the five read as one sweep.
  document.body.style.setProperty('--glow-x', `${15 + (n - 1) * 17}%`);
</script>
</body>
</html>
