<!doctype html>
<!--
  App Store header and search-result artwork (no text, so one image works in
  every language; the phones show the localized captures).
  Open as header.html?lang=fr. The page fills the window: render.sh draws it
  at 5244 × 2950 (16:9) and 3840 × 1646 (panoramic). Everything that matters
  sits in the middle third, since the store crops by orientation.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --foam: #8fd6f2; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(45% 70% at 50% 18%, rgba(62, 155, 199, 0.50), transparent 70%),
      radial-gradient(40% 60% at 8% 100%, rgba(31, 110, 140, 0.55), transparent 70%),
      radial-gradient(40% 60% at 92% 100%, rgba(31, 110, 140, 0.45), transparent 70%),
      linear-gradient(170deg, #0b3d5c 0%, #07314a 58%, #062940 100%);
  }
  .waves { position: absolute; left: 0; right: 0; bottom: 0; height: 62vh; width: 100vw; }
  /* Light caustics: soft bubbles rising on both sides. */
  .bubble {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.55), rgba(143,214,242,0.12) 55%, transparent 70%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18);
  }
  /* Device drawn at 1004 × 2130 and scaled by --s. */
  .phone {
    position: absolute; left: 50%; top: 0;
    width: 1004px; height: 2130px;
    border-radius: 158px; padding: 22px;
    background: linear-gradient(145deg, #3a4b57 0%, #121d25 40%, #0b141a 60%, #33444f 100%);
    box-shadow:
      0 0 0 3px rgba(255, 255, 255, 0.14),
      0 80px 160px rgba(2, 18, 30, 0.65),
      0 24px 48px rgba(2, 18, 30, 0.4);
    transform-origin: 50% 0;
  }
  .phone::before { content: ''; position: absolute; inset: 10px; border-radius: 148px; background: #05090c; }
  .screen { position: relative; width: 960px; height: 2086px; border-radius: 136px; overflow: hidden; background: #000; }
  .screen img { display: block; width: 100%; height: 100%; }
  .island { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); width: 274px; height: 80px; border-radius: 40px; background: #000; }
</style>
</head>
<body>
<svg class="waves" viewBox="0 0 1600 600" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0 210 C 260 160, 520 270, 800 215 S 1340 160, 1600 205 L1600 600 L0 600 Z" fill="rgba(62,155,199,0.10)"/>
  <path d="M0 300 C 300 250, 560 350, 840 300 S 1360 250, 1600 300 L1600 600 L0 600 Z" fill="rgba(62,155,199,0.10)"/>
  <path d="M0 400 C 280 360, 600 450, 880 405 S 1380 360, 1600 400 L1600 600 L0 600 Z" fill="rgba(4,30,46,0.45)"/>
</svg>
<div id="bubbles"></div>
<div id="phones"></div>

<script>
  const lang = new URLSearchParams(location.search).get('lang') === 'fr' ? 'fr' : 'en';
  const W = innerWidth, H = innerHeight;

  // Centre phone rises from the bottom edge; the two others sit behind it,
  // a little lower and turned outward.
  const centre = (H * 1.02) / 2130;           // scale: centre phone ~ full height
  const phones = [
    { shot: '03-dose',    dx: -0.80, dy: 0.18, s: 0.88, rot: -8, z: 1 },
    { shot: '05-widgets', dx:  0.80, dy: 0.18, s: 0.88, rot:  8, z: 1 },
    { shot: '01-home',    dx:  0,    dy: 0.11, s: 1,    rot:  0, z: 2 },
  ];
  const host = document.getElementById('phones');
  for (const p of phones) {
    const s = centre * p.s;
    const el = document.createElement('div');
    el.className = 'phone';
    el.style.zIndex = p.z;
    const x = p.dx * 1004 * centre;            // offset in phone widths
    el.style.transform = `translateX(calc(-50% + ${x}px)) translateY(${p.dy * H}px) scale(${s}) rotate(${p.rot}deg)`;
    el.style.transformOrigin = '50% 0';
    el.innerHTML = `<div class="screen"><img src="../iphone-6.9/${lang}/${p.shot}.png" alt=""><div class="island"></div></div>`;
    host.appendChild(el);
  }
  // The scale must apply around the top centre without moving the -50%:
  // translate first (in layout px), then scale.

  // Bubbles: deterministic, away from the phones.
  const b = document.getElementById('bubbles');
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 38; i++) {
    const side = i % 2 ? 1 : -1;
    const x = W / 2 + side * (W * 0.24 + rnd() * W * 0.26);
    const y = H * (0.08 + rnd() * 0.84);
    const r = H * (0.006 + rnd() * rnd() * 0.035);
    const d = document.createElement('div');
    d.className = 'bubble';
    Object.assign(d.style, { left: `${x - r}px`, top: `${y - r}px`, width: `${2 * r}px`, height: `${2 * r}px`, opacity: 0.35 + rnd() * 0.5 });
    b.appendChild(d);
  }
</script>
</body>
</html>
