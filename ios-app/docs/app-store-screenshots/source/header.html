<!doctype html>
<!--
  App Store header artwork (no text, so one image works in every language;
  the phone shows the localized home screen).
  Open as header.html?lang=fr. The page fills the window: render-header.sh
  draws it at 5244 × 2950 (16:9) and 3840 × 1646 (panoramic).
  The store crops it hard on iPhone (a narrow centre band, with the Dynamic
  Island and the back/share buttons over the top), so the one phone stays
  small, centred and clear of the top fifth.
  Background, waves and bubbles follow the landing page hero (and the app's
  ambient bubbles): flat white discs, 5 to 16 px at a 1440 px width, opacity
  0.12 to 0.36.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  body {
    position: relative;
    --u: calc(100vw / 1440);  /* one landing-page pixel */
    background:
      radial-gradient(60% 80% at 50% 30%, rgba(62, 155, 199, 0.30), transparent 65%),
      linear-gradient(168deg, #0b3d5c 0%, #07314a 62%, #062940 100%);
  }
  .bubble { position: absolute; border-radius: 50%; background: #fff; }
  .waves { position: absolute; left: 0; right: 0; bottom: -1px; height: 13vh; }
  .wave { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; }
  .wave path { fill: #062940; }
  .wave.back { height: 120%; opacity: 0.35; transform: translateX(-12%); width: 124%; }
  /* Device drawn at 1004 × 2130 and scaled to fit. */
  .phone {
    position: absolute; left: 50%; top: 0;
    width: 1004px; height: 2130px;
    border-radius: 158px; padding: 22px;
    background: linear-gradient(145deg, #3a4b57 0%, #121d25 40%, #0b141a 60%, #33444f 100%);
    box-shadow:
      0 0 0 3px rgba(255, 255, 255, 0.14),
      0 70px 140px rgba(2, 18, 30, 0.55),
      0 20px 40px rgba(2, 18, 30, 0.35);
    transform-origin: 50% 0;
  }
  .phone::before { content: ''; position: absolute; inset: 10px; border-radius: 148px; background: #05090c; }
  .screen { position: relative; width: 960px; height: 2086px; border-radius: 136px; overflow: hidden; background: #000; }
  .screen img { display: block; width: 100%; height: 100%; }
  .island { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); width: 274px; height: 80px; border-radius: 40px; background: #000; }
</style>
</head>
<body>
<div id="bubbles"></div>
<div class="waves" aria-hidden="true">
  <svg class="wave back" viewBox="0 0 1440 120" preserveAspectRatio="none">
    <path d="M0,60 C240,100 480,20 720,60 C960,100 1200,20 1440,60 L1440,120 L0,120 Z"/>
  </svg>
  <svg class="wave front" viewBox="0 0 1440 120" preserveAspectRatio="none">
    <path d="M0,60 C240,100 480,20 720,60 C960,100 1200,20 1440,60 L1440,120 L0,120 Z"/>
  </svg>
</div>
<div class="phone" id="phone">
  <div class="screen"><img id="shot" alt=""><div class="island"></div></div>
</div>

<script>
  const lang = new URLSearchParams(location.search).get('lang') === 'fr' ? 'fr' : 'en';
  const W = innerWidth, H = innerHeight, u = W / 1440;
  document.getElementById('shot').src = `../iphone-6.9/${lang}/01-home.png`;

  // One phone, 62 % of the height, from 24 % down: the top fifth stays free
  // for the store's buttons, the bottom of the phone sinks into the wave.
  const s = (H * 0.62) / 2130 * (2130 / 2130);
  const phone = document.getElementById('phone');
  phone.style.top = `${H * 0.24}px`;
  phone.style.transform = `translateX(-50%) scale(${s})`;

  // The landing page's twelve bubbles (x %, size, opacity), spread over the
  // height as if caught mid-rise, plus a mirrored second pass for width.
  const set = [
    [6, 9, 0.22], [13, 15, 0.3], [21, 6, 0.14], [30, 12, 0.34], [39, 7, 0.18], [47, 16, 0.26],
    [55, 5, 0.12], [63, 11, 0.2], [71, 8, 0.36], [79, 14, 0.16], [87, 6, 0.28], [94, 10, 0.2],
  ];
  const heights = [0.72, 0.38, 0.84, 0.55, 0.22, 0.66, 0.47, 0.8, 0.3, 0.6, 0.42, 0.75];
  const host = document.getElementById('bubbles');
  set.forEach(([x, size, a], i) => {
    const d = size * u * 1.6;
    const el = document.createElement('span');
    el.className = 'bubble';
    Object.assign(el.style, {
      left: `${x}%`, top: `${heights[i] * H}px`,
      width: `${d}px`, height: `${d}px`, opacity: a,
    });
    host.appendChild(el);
  });
</script>
</body>
</html>
